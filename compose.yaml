
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: incident-api:1.0
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: incident-ui:1.0
    environment:
      API_URL: http://api:5000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
